[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oin-control-plane"
version = "0.5.0"
description = "OIN V01 account, device enrollment, and allowlisted Android control plane"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "fastapi==0.139.0",
  "psycopg[binary]==3.3.2",
  "qrcode==8.2",
  "uvicorn[standard]==0.50.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.scripts]
oin-control-plane = "oin_control_plane.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
oin_control_plane = ["schema.sql", "schema.postgresql.sql", "migration_v*.sql", "migration_v*.postgresql.sql", "seller.html", "seller.js", "seller.css", "oin-brand.svg"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
